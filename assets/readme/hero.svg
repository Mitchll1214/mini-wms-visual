<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">小仓图管 MiniWMS Visual</title>
  <desc id="heroDesc">面向小仓库的货位可视化、库存展示与拍照标记管理系统</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141f38"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b74ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3b74ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a80ff"/>
      <stop offset="1" stop-color="#2c53e6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="220" rx="24" fill="url(#glow)"/>

  <!-- 背景货位网格底纹 -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- 左侧：品牌与说明 -->
  <g font-family="system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="72" y="72" width="52" height="52" rx="13" fill="url(#acc)"/>
    <text x="98" y="108" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">W</text>

    <text x="72" y="196" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1.5">小仓图管</text>
    <text x="72" y="232" font-size="22" fill="#8fa2c4" letter-spacing="3">MINIWMS VISUAL</text>

    <text x="72" y="278" font-size="21" fill="#c6d2e6">面向小仓库的货位可视化、库存展示与拍照标记管理系统</text>

    <g transform="translate(72, 306)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="75" y="23" font-size="16" fill="#dbe4f5" text-anchor="middle">Spring Boot 3</text>

      <rect x="162" y="0" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="214" y="23" font-size="16" fill="#dbe4f5" text-anchor="middle">Vue 3</text>

      <rect x="278" y="0" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="334" y="23" font-size="16" fill="#dbe4f5" text-anchor="middle">SQLite</text>

      <rect x="402" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="477" y="23" font-size="16" fill="#dbe4f5" text-anchor="middle">Docker Compose</text>
    </g>
  </g>

  <!-- 右侧：货位货架示意 -->
  <g font-family="system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 货位格：3 列 × 3 行 -->
    <g>
      <rect x="714" y="88"  width="128" height="64" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="856" y="88"  width="128" height="64" rx="10" fill="#4a80ff" fill-opacity="0.16" stroke="#5c8bff" stroke-opacity="0.55"/>
      <rect x="998" y="88"  width="128" height="64" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>

      <rect x="714" y="168" width="128" height="64" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="856" y="168" width="128" height="64" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="998" y="168" width="128" height="64" rx="10" fill="#4a80ff" fill-opacity="0.16" stroke="#5c8bff" stroke-opacity="0.55"/>

      <rect x="714" y="248" width="128" height="64" rx="10" fill="#4a80ff" fill-opacity="0.16" stroke="#5c8bff" stroke-opacity="0.55"/>
      <rect x="856" y="248" width="128" height="64" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="998" y="248" width="128" height="64" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    </g>

    <!-- 货位标签与库存数字 -->
    <g font-size="15" font-weight="600">
      <text x="730" y="126" fill="#9fb2d2">A-01</text>
      <text x="872" y="126" fill="#dbe7ff">A-02</text>
      <text x="1014" y="126" fill="#9fb2d2">A-03</text>

      <text x="730" y="206" fill="#9fb2d2">B-01</text>
      <text x="872" y="206" fill="#9fb2d2">B-02</text>
      <text x="1014" y="206" fill="#dbe7ff">B-03</text>

      <text x="730" y="286" fill="#dbe7ff">C-01</text>
      <text x="872" y="286" fill="#9fb2d2">C-02</text>
      <text x="1014" y="286" fill="#9fb2d2">C-03</text>
    </g>
    <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13">
      <text x="730" y="144" fill="#6f83a6">240</text>
      <text x="872" y="144" fill="#a9c2ff">86</text>
      <text x="1014" y="144" fill="#6f83a6">1500</text>

      <text x="730" y="224" fill="#6f83a6">64</text>
      <text x="872" y="224" fill="#6f83a6">310</text>
      <text x="1014" y="224" fill="#a9c2ff">128</text>

      <text x="730" y="304" fill="#a9c2ff">95</text>
      <text x="872" y="304" fill="#6f83a6">58</text>
      <text x="1014" y="304" fill="#6f83a6">402</text>
    </g>

    <text x="714" y="352" font-size="17" fill="#8fa2c4" letter-spacing="1">货位 · 商品 · 库存</text>
  </g>
</svg>
